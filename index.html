<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDS - Eduard Distribution Supplies</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6 max-w-4xl">
        <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">EDS Web Application</h1>
            <span id="user-status" class="text-sm bg-blue-700 px-3 py-1 rounded">Wala naka-log in</span>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Login Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Login sa Sistema</h2>
                <form id="login-form" onsubmit="onLoginSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-gray-600 text-sm mb-1">Email</label>
                        <input type="email" id="login-email" required class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 text-sm mb-1">Password</label>
                        <input type="password" id="login-pass" required class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Log In</button>
                </form>
            </div>

            <!-- Products Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Mga Produkto sa Database</h2>
                <div id="product-list" class="space-y-3 max-h-60 overflow-y-auto">
                    <p class="text-gray-500 text-sm">Nag-load sa mga produkto...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript para sa API Calls -->
    <script>
        const API_URL = 'http://localhost:3000/api';

        // Function sa pag-handle sa Login Form
        async function onLoginSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            try {
                const response = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pass })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    document.getElementById('user-status').innerText = `Kumusta, ${data.user.name}`;
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error('Sayop sa pag-login:', error);
                alert('Napakyas sa pagkonek sa server.');
            }
        }

        // Function sa pagkuha ug pagpakita sa mga produkto gikan sa database
        async function fetchProductsFromDB() {
            const productListContainer = document.getElementById('product-list');
            try {
                const response = await fetch(`${API_URL}/products`);
                const products = await response.json();
                
                if (products.length === 0) {
                    productListContainer.innerHTML = '<p class="text-gray-500 text-sm">Walay nakit-an nga produkto.</p>';
                    return;
                }

                productListContainer.innerHTML = '';
                products.forEach(prod => {
                    const item = document.createElement('div');
                    item.className = 'p-3 bg-gray-50 border border-gray-200 rounded flex justify-between items-center';
                    item.innerHTML = `
                        <div>
                            <p class="font-semibold text-gray-800">${prod.name || prod.product_name || 'Produkto'}</p>
                            <p class="text-xs text-gray-500">Presyo: ₱${prod.price || '0.00'}</p>
                        </div>
                        <button onclick="orderProduct(${prod.id})" class="bg-green-600 text-white text-xs px-3 py-1 rounded hover:bg-green-700">Order</button>
                    `;
                    productListContainer.appendChild(item);
                });
            } catch (error) {
                console.error('Napakyas sa pagkuha sa mga produkto:', error);
                productListContainer.innerHTML = '<p class="text-red-500 text-sm">Dili mahimong makonektar sa server.</p>';
            }
        }

        // Dummy function para sa pag-order sa piho nga produkto
        async function orderProduct(productId) {
            const currentUser = JSON.parse(sessionStorage.getItem('user'));
            if (!currentUser) {
                alert('Palihug una og log in aron makapagawas og order!');
                return;
            }

            const orderData = {
                user_id: currentUser.id,
                total_amount: 100.00,
                items: [{ product_id: productId, quantity: 1 }]
            };

            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const result = await response.json();
                
                if (result.success) {
                    alert(`Malampuson ang order! Order ID: ${result.orderId}`);
                } else {
                    alert('Napakyas ang pag-order.');
                }
            } catch (error) {
                console.error('Sayop sa order:', error);
            }
        }

        // Awtomatikong kargaun ang mga produkto pag-abli sa panid
        window.onload = () => {
            fetchProductsFromDB();
        };
    </script>
</body>
</html>
